[package]
name = "bevy_components_importer"
version = "0.4.0"
edition = "2024"
description = "Import Blender-authored Bevy Components from glTF extras"

[dependencies]
avian3d = { version = "0.8.0", features = ["collider-from-mesh"] }
basisu = "0.1.0"
bevy = "0.20.0"
ktx2 = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
