[package]
name = "bevy_components_importer"
version = "0.5.2"
edition = "2024"
description = "Import Blender-authored Bevy Components from glTF extras"
license = "MIT"

[dependencies]
avian3d = { version = "0.8.0", features = ["collider-from-mesh"] }
basisu = "0.1.0"
bevy = "0.20.1"
ktx2 = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
bevy = { version = "0.20.1", features = ["file_watcher", "free_camera"] }
