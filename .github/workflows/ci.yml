name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    addon:
        name: Python tests and extension ZIP
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Check Python syntax
              run: python -m compileall -q addon scripts tests
            - name: Run unit tests
              run: python -m unittest discover -s tests -v
            - name: Package Blender extension
              run: python scripts/build_addon.py
            - name: Upload installable extension
              uses: actions/upload-artifact@v4
              with:
                  name: bevy_components_addon
                  path: dist/*.zip
    blender:
        name: Blender ${{ matrix.blender }} tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - blender: '4.2.23'
                      python: '3.11'
                    - blender: '5.2.3'
                      python: '3.13'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libgomp1 libsm6 libx11-6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1
            - name: Install KTX-Software
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release download v4.4.0 --repo KhronosGroup/KTX-Software --pattern '*-Linux-x86_64.deb' --dir ktx_software
                  sudo apt-get install -y ./ktx_software/*.deb
                  ktx --version
            - name: Install Blender as a Python module
              run: pip install bpy==${{ matrix.blender }}
            - name: Run Blender tests
              env:
                  BEVY_COMPONENTS_REQUIRE_KTX: 1
              run: python tests/blender/run.py -v
    blender_texture_compression:
        name: Blender texture compression on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'
            - name: Install KTX-Software on macOS
              if: runner.os == 'macOS'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release download v4.4.0 --repo KhronosGroup/KTX-Software --pattern '*-Darwin-arm64.pkg' --dir ktx_software
                  sudo installer -pkg ktx_software/*.pkg -target /
            - name: Install KTX-Software on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release download v4.4.0 --repo KhronosGroup/KTX-Software --pattern '*-Windows-x64.exe' --dir ktx_software
                  $installer = Get-ChildItem ktx_software -Filter *.exe | Select-Object -First 1
                  Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
            - name: Install Blender as a Python module
              run: pip install bpy==5.2.3
            - name: Run texture compression tests
              env:
                  BEVY_COMPONENTS_REQUIRE_KTX: 1
              run: python tests/blender/run.py -v -k TextureCompression
    importer:
        name: Rust importer tests on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        env:
            CARGO_PROFILE_DEV_DEBUG: 0
        steps:
            - uses: actions/checkout@v4
            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: importer
            - name: Test importer
              run: cargo test --manifest-path importer/Cargo.toml
            - name: Render compressed levels on the GPU
              env:
                  BEVY_COMPONENTS_RENDER_OUTPUT: ${{ github.workspace }}/renders
              run: cargo test --manifest-path importer/Cargo.toml --test rendering -- --ignored --nocapture
            - name: Upload renders
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: renders_${{ runner.os }}
                  path: renders
                  if-no-files-found: ignore
    release:
        name: Publish release
        needs: [addon, blender, blender_texture_compression, importer]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: bevy_components_addon
                  path: dist
            - name: Read version
              run: echo "VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("addon/blender_manifest.toml", "rb"))["version"])')" >> "$GITHUB_ENV"
            - name: Package importer
              run: git archive --format=zip --prefix="bevy_components_importer/" -o "dist/bevy_components_importer_${VERSION//./_}.zip" HEAD:importer
            - name: Publish release
              run: |
                  tag="bevy_components_${VERSION//./_}"
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released, bump the version to publish a new one"
                  else
                      gh release create "$tag" "dist/bevy_components_${VERSION//./_}.zip" "dist/bevy_components_importer_${VERSION//./_}.zip" --target "$GITHUB_SHA" --title "Bevy Components $VERSION" --notes "Download bevy_components_${VERSION//./_}.zip for the Blender addon and bevy_components_importer_${VERSION//./_}.zip for the Rust importer. See the README for installation."
                  fi
    delete_merged_branches:
        name: Delete merged branches
        needs: [addon, blender, blender_texture_compression, importer]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Delete branches already in the tested main commit
              run: |
                  open_heads=$(gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName')
                  for branch in $(git for-each-ref --merged "$GITHUB_SHA" --format='%(refname:lstrip=3)' refs/remotes/origin); do
                      if [ "$branch" = main ] || [ "$branch" = HEAD ] || grep -qxF "$branch" <<< "$open_heads"; then
                          continue
                      fi
                      git push origin --delete "$branch" || echo "Could not delete $branch"
                  done
