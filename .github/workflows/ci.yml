name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    addon:
        name: Python tests and extension ZIP
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            - name: Check Python syntax
              run: python -m compileall -q addon scripts tests
            - name: Run unit tests
              run: python -m unittest discover -s tests -v
            - name: Package Blender extension
              run: python scripts/build_addon.py
            - name: Upload installable extension
              uses: actions/upload-artifact@v4
              with:
                  name: bevy_components_addon
                  path: dist/*.zip
    importer:
        name: Rust importer check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: importer
            - name: Check importer
              run: cargo check --manifest-path importer/Cargo.toml
    release:
        name: Publish release
        needs: [addon, importer]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: bevy_components_addon
                  path: dist
            - name: Read version
              run: echo "VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("addon/blender_manifest.toml", "rb"))["version"])')" >> "$GITHUB_ENV"
            - name: Package importer
              run: git archive --format=zip --prefix="bevy_components_importer/" -o "dist/bevy_components_importer_${VERSION//./_}.zip" HEAD:importer
            - name: Publish release
              run: |
                  tag="bevy_components_${VERSION//./_}"
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released, bump the version to publish a new one"
                  else
                      gh release create "$tag" "dist/bevy_components_${VERSION//./_}.zip" "dist/bevy_components_importer_${VERSION//./_}.zip" --target "$GITHUB_SHA" --title "Bevy Components $VERSION" --notes "Download bevy_components_${VERSION//./_}.zip for the Blender addon and bevy_components_importer_${VERSION//./_}.zip for the Rust importer. See the README for installation."
                  fi
