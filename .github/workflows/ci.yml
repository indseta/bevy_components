name: CI

on:
    push:
        branches: [main]
        paths-ignore: ['**.md', 'LICENSE']
    pull_request:
        paths-ignore: ['**.md', 'LICENSE']
    workflow_dispatch:

# A newer push to the same pull request cancels the older run.
# Pushes to main queue instead, so a release is never cut off halfway.
concurrency:
    group: ci_${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    linux:
        name: Tests, extension ZIP and release
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
        env:
            CARGO_PROFILE_DEV_DEBUG: 0
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4

            # apt-get update has stalled for 6 hours on the Ubuntu mirror before,
            # so each attempt gets two minutes and a retry
            - name: Install Linux dependencies
              timeout-minutes: 8
              run: |
                  for attempt in 1 2 3; do
                      timeout 120 sudo apt-get update && break
                      echo "apt-get update attempt $attempt stalled or failed"
                  done
                  sudo apt-get install -y --no-install-recommends \
                      libegl1 libgl1 libgl1-mesa-dri libgomp1 libsm6 libx11-6 libxfixes3 libxi6 libxkbcommon0 libxrender1 libxxf86vm1 \
                      pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers

            - name: Install KTX-Software
              timeout-minutes: 5
              run: |
                  gh release download v4.4.0 --repo KhronosGroup/KTX-Software --pattern '*-Linux-x86_64.deb' --dir "$RUNNER_TEMP/ktx_software"
                  sudo apt-get install -y "$RUNNER_TEMP"/ktx_software/*.deb
                  ktx --version

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Check Python syntax and run unit tests
              run: |
                  python -m compileall -q addon scripts tests
                  python -m unittest discover -s tests -v

            - name: Package Blender extension
              run: python scripts/build_addon.py

            - name: Run Blender 4.2 tests
              env:
                  BEVY_COMPONENTS_REQUIRE_KTX: 1
              run: |
                  pip install bpy==4.2.23
                  python tests/blender/run.py -v

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Run Blender 5.2 tests
              env:
                  BEVY_COMPONENTS_REQUIRE_KTX: 1
              run: |
                  pip install bpy==5.2.3
                  python tests/blender/run.py -v

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: importer
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - name: Test importer
              run: cargo test --manifest-path importer/Cargo.toml

            - name: Render compressed scenes on the GPU
              env:
                  BEVY_COMPONENTS_RENDER_OUTPUT: ${{ github.workspace }}/renders
              run: cargo test --manifest-path importer/Cargo.toml --test rendering -- --ignored --nocapture

            - name: Upload renders
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: renders_linux
                  path: renders
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Upload installable extension
              if: github.event_name == 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: bevy_components_addon
                  path: dist/*.zip
                  retention-days: 7

            # Runs only after every test above passed, and only when the version
            # on main has no release yet, so bumping the version publishes it
            - name: Publish release when the version is new
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: |
                  version=$(python3 -c 'import tomllib; print(tomllib.load(open("addon/blender_manifest.toml", "rb"))["version"])')
                  tag="bevy_components_${version//./_}"
                  if gh release view "$tag" > /dev/null 2>&1; then
                      echo "$tag is already released, bump the version to publish a new one"
                      exit 0
                  fi
                  git archive --format=zip --prefix="bevy_components_importer/" -o "dist/bevy_components_importer_${version//./_}.zip" HEAD:importer
                  gh release create "$tag" "dist/bevy_components_${version//./_}.zip" "dist/bevy_components_importer_${version//./_}.zip" --target "$GITHUB_SHA" --title "Bevy Components $version" --notes "Download bevy_components_${version//./_}.zip for the Blender addon and bevy_components_importer_${version//./_}.zip for the Rust importer. See the README for installation."
